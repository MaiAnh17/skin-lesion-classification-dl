# Transfer Learning configuration - ResNet18
seed: 42

model:
  name: resnet18
  num_classes: 7
  pretrained: true
  freeze_backbone: true
  dropout: 0.3

input:
  image_size: 224

training:
  batch_size: 32
  num_workers: 0
  num_epochs: 20
  learning_rate: 0.001
  weight_decay: 0.0001
  early_stopping_patience: 5

scheduler:
  name: ReduceLROnPlateau
  mode: min
  factor: 0.5
  patience: 2

outputs:
  checkpoint: outputs/checkpoints/transfer_resnet18_best.pt
  history: outputs/metrics/transfer_resnet18_training_history.csv
  loss_figure: outputs/figures/transfer_resnet18_loss_curve.png
  accuracy_figure: outputs/figures/transfer_resnet18_accuracy_curve.png
